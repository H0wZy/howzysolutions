<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marcos "H0wZy" Junior · Developer</title>
    <meta
      name="description"
      content="Developer portfolio with real projects, their stacks, and their declared limitations."
    />
    <script>
      /*
       * Dark is the only theme (research D12). `data-theme="dark"` above is
       * static, nothing resolves it. This blocking script now exists only to
       * apply a stored locale before first paint, same reasoning as before:
       * anything inside React runs after, and that would be the flash.
       */
      ;(function () {
        try {
          var locale = localStorage.getItem('h0wzy.locale')
          if (locale === 'en' || locale === 'pt') document.documentElement.lang = locale
        } catch (e) {
          /* Private mode blocks storage; the lang attribute already stands. */
        }
        /*
         * The home page's intro, once per session: only on the home page, not on a
         * deep link, not with reduced motion. The class is what shows the intro
         * (site.css); src/enhance/home.ts runs it, and a CSS animation removes it
         * on its own if that script never finishes.
         */
        try {
          if (
            (location.pathname === '/' || location.pathname === '/pt/') &&
            !location.hash &&
            !matchMedia('(prefers-reduced-motion: reduce)').matches &&
            !sessionStorage.getItem('h0wzy.intro')
          ) {
            sessionStorage.setItem('h0wzy.intro', '1')
            document.documentElement.classList.add('intro-on')
          }
        } catch (e) {
          /* No storage, no intro: the page is complete without it. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
