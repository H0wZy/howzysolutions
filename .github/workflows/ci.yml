# Checks every push and pull request. Deploying is not done here: Cloudflare
# Workers Builds watches main and runs `npx wrangler deploy` itself, so a
# deploy step here would publish every commit twice.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Tests first: they assert the COMMITTED artifacts are real captures, and
      # a runner with no CV checkout or WakaTime key rewrites them as fallbacks
      # during the build. `npm test` is these two plus check-bundle, which the
      # build already ends with.
      - run: npx vitest run
      - run: node scripts/check-contrast.mjs
      - run: npm run build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
